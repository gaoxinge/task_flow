[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-flow"
version = "0.1.0"
description = "Compile a small subset of Python functions into a DAG and execute it."
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "gaoxinge"}]
dependencies = []

[project.optional-dependencies]
graphviz = ["graphviz>=0.20"]
examples = ["flask>=2", "grpcio>=1.48", "grpcio-tools>=1.48", "protobuf>=3.20", "requests>=2"]

[dependency-groups]
dev = ["pytest>=7,<8.4", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --capture=no"

[tool.setuptools.packages.find]
include = ["task_flow*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
